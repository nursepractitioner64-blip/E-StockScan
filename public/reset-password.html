<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  Reset Password - Emergency Check List
</title>

<script
  src="https://cdn.jsdelivr.net/npm/sweetalert2@11"
></script>

<link
  rel="stylesheet"
  href="/style.css"
>

<style>

*{
  box-sizing:border-box;
}


body{

  margin:0;

}


.reset-page{

  min-height:100vh;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:20px;

  background:#0f172a;

  color:#fff;

  font-family:
    Prompt,
    system-ui,
    sans-serif;

}


.reset-card{

  width:100%;

  max-width:430px;

  background:#1e293b;

  border-radius:20px;

  padding:28px;

  box-shadow:
    0 20px 50px
    rgba(0,0,0,.3);

}


.reset-logo{

  text-align:center;

  font-size:44px;

}


.reset-title{

  text-align:center;

  margin:
    8px 0 4px;

}


.reset-subtitle{

  text-align:center;

  color:#94a3b8;

  font-size:13px;

  margin-bottom:24px;

}


.reset-form{

  display:grid;

  gap:14px;

}


.reset-form label{

  display:block;

  font-size:12px;

  color:#cbd5e1;

  margin-bottom:5px;

}


.reset-form input{

  width:100%;

  padding:
    11px
    12px;

  border:
    1px solid
    #334155;

  background:#0f172a;

  color:#fff;

  border-radius:10px;

  outline:none;

}


.reset-form input:focus{

  border-color:
    #22c55e;

}


.reset-btn{

  width:100%;

  border:0;

  border-radius:10px;

  padding:12px;

  font-weight:800;

  cursor:pointer;

}


.reset-btn:disabled{

  opacity:.55;

  cursor:not-allowed;

}


.btn-reset{

  background:#22c55e;

  color:#052e16;

}


.btn-back{

  background:#334155;

  color:#fff;

}


.reset-note{

  background:#0f172a;

  border:
    1px solid
    #334155;

  border-radius:10px;

  padding:
    10px
    12px;

  font-size:12px;

  color:#94a3b8;

  line-height:1.7;

}


.reset-user{

  color:#22c55e;

  font-weight:800;

}


.reset-error{

  display:none;

  text-align:center;

  color:#fca5a5;

  background:#450a0a;

  border:
    1px solid
    #7f1d1d;

  border-radius:10px;

  padding:12px;

  font-size:13px;

}


.reset-success{

  display:none;

}


.password-note{

  font-size:11px;

  color:#94a3b8;

}


</style>

</head>


<body class="reset-page">


<div class="reset-card">


  <!-- =========================================
       HEADER
  ========================================== -->

  <div class="reset-logo">
    🔐
  </div>


  <h2 class="reset-title">
    Reset Password
  </h2>


  <div class="reset-subtitle">
    Emergency Check List
  </div>


  <!-- =========================================
       ERROR
  ========================================== -->

  <div
    id="resetError"
    class="reset-error"
  >
    Reset Link ไม่ถูกต้อง
  </div>


  <!-- =========================================
       RESET AREA
  ========================================== -->

  <div id="resetArea">


    <div class="reset-note">

      Username

      <div
        id="resetUsername"
        class="reset-user"
      >
        กำลังตรวจสอบ...
      </div>

      <br>

      Reset Link นี้ใช้ได้
      <strong>15 นาที</strong>
      และใช้ได้เพียงครั้งเดียว

    </div>


    <br>


    <form
      id="resetForm"
      class="reset-form"
    >


      <!-- PASSWORD -->

      <div>

        <label>
          Password ใหม่
        </label>

        <input
          id="newPassword"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        >

      </div>


      <!-- CONFIRM -->

      <div>

        <label>
          Confirm Password
        </label>

        <input
          id="confirmPassword"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        >

      </div>


      <div class="password-note">

        Password ต้องมีอย่างน้อย
        8 ตัวอักษร

      </div>


      <button
        id="resetBtn"
        class="reset-btn btn-reset"
        type="submit"
      >

        🔐 เปลี่ยนรหัสผ่าน

      </button>


      <button
        id="backBtn"
        class="reset-btn btn-back"
        type="button"
      >

        ← กลับหน้า Login

      </button>


    </form>


  </div>


  <!-- =========================================
       SUCCESS
  ========================================== -->

  <div
    id="successArea"
    class="reset-success"
  >


    <div class="reset-note">

      <div
        style="
          font-size:32px;
          text-align:center;
          margin-bottom:10px;
        "
      >
        ✅
      </div>


      <div
        style="
          text-align:center;
          color:#86efac;
          font-size:16px;
          font-weight:800;
        "
      >

        เปลี่ยนรหัสผ่านสำเร็จ

      </div>


      <br>


      <div
        style="
          text-align:center;
        "
      >

        คุณสามารถใช้ Password ใหม่
        Login เข้าระบบได้แล้ว

      </div>

    </div>


    <br>


    <button
      id="successLoginBtn"
      class="reset-btn btn-reset"
      type="button"
    >

      🔐 ไปหน้า Login

    </button>


  </div>


</div>


<script>

"use strict";


/* =====================================================
   HELPERS
===================================================== */

const $ = id =>
  document.getElementById(id);


/* =====================================================
   API
===================================================== */

async function api(
  url,
  options = {}
){

  const res =
    await fetch(
      url,
      {

        credentials:"include",

        ...options,

        headers:{
          "Content-Type":
            "application/json",

          ...(options.headers || {})

        }

      }
    );


  let data = {};


  try{

    data =
      await res.json();

  }catch{

    data = {};

  }


  if(!res.ok){

    throw new Error(
      data.message ||
      "เกิดข้อผิดพลาด"
    );

  }


  return data;

}


/* =====================================================
   TOKEN
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const token =
  String(
    params.get("token") || ""
  ).trim();


/* =====================================================
   VERIFY TOKEN
===================================================== */

async function verifyToken(){

  if(!token){

    showError(
      "ไม่พบ Reset Token"
    );

    return;

  }


  try{

    const data =
      await api(
        "/api/auth/reset-password/verify?token=" +
        encodeURIComponent(token)
      );


    $("resetUsername")
      .textContent =
        data.username ||
        "-";


  }catch(err){

    console.error(
      "VERIFY RESET TOKEN:",
      err
    );


    showError(
      err.message ||
      "Reset Link ไม่ถูกต้อง หรือหมดอายุแล้ว"
    );

  }

}


/* =====================================================
   SHOW ERROR
===================================================== */

function showError(
  message
){

  $("resetError")
    .textContent =
      message;


  $("resetError")
    .style
    .display =
      "block";


  $("resetArea")
    .style
    .display =
      "none";

}


/* =====================================================
   RESET PASSWORD
===================================================== */

$("resetForm").onsubmit =
  async e => {

    e.preventDefault();


    const password =
      $("newPassword")
        .value;


    const confirmPassword =
      $("confirmPassword")
        .value;


    if(
      password.length < 8
    ){

      await Swal.fire({

        icon:"warning",

        title:
          "Password ไม่ถูกต้อง",

        text:
          "Password ต้องมีอย่างน้อย 8 ตัวอักษร"

      });

      return;

    }


    if(
      password !==
      confirmPassword
    ){

      await Swal.fire({

        icon:"warning",

        title:
          "Password ไม่ตรงกัน",

        text:
          "กรุณาตรวจสอบ Password และ Confirm Password"

      });

      return;

    }


    try{

      $("resetBtn")
        .disabled = true;


      $("resetBtn")
        .textContent =
          "⏳ กำลังเปลี่ยนรหัสผ่าน...";


      const data =
        await api(
          "/api/auth/reset-password",
          {

            method:"POST",

            body:
              JSON.stringify({

                token:

                  token,

                password:

                  password,

                confirm_password:

                  confirmPassword

              })

          }
        );


      $("resetArea")
        .style
        .display =
          "none";


      $("successArea")
        .style
        .display =
          "block";


      console.log(
        "RESET SUCCESS:",
        data
      );


    }catch(err){

      console.error(
        "RESET PASSWORD ERROR:",
        err
      );


      Swal.fire({

        icon:"error",

        title:
          "เปลี่ยนรหัสผ่านไม่สำเร็จ",

        text:
          err.message ||
          "Reset Link อาจหมดอายุหรือถูกใช้ไปแล้ว"

      });


    }finally{

      $("resetBtn")
        .disabled = false;


      $("resetBtn")
        .textContent =
          "🔐 เปลี่ยนรหัสผ่าน";

    }

  };


/* =====================================================
   BACK TO LOGIN
===================================================== */

$("backBtn").onclick =
  () => {

    window.location.href =
      "/";

  };


$("successLoginBtn").onclick =
  () => {

    window.location.href =
      "/";

  };


/* =====================================================
   INIT
===================================================== */

verifyToken();

</script>


</body>

</html>
